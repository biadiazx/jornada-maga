<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada da Maga</title>
<meta name="theme-color" content="#130f1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Plano: noite de grimório. Tinta violeta-escura, ouro antigo como acento, brilho arcano ciano só na magia.
   Layout: palco da maga à esquerda, missões à direita; cartas de grimório abaixo. */
:root{
  --ink:#130f1e;
  --night:#1d1830;
  --night-2:#28213f;
  --parchment:#f2e8d0;
  --mist:#a89fbf;
  --gold:#e8c26a;
  --arcane:#7fe0cf;
  --rose:#ff9db1;
  --line:rgba(232,194,106,.2);
  --display:"Cinzel Decorative", "Times New Roman", serif;
  --caps:"Alegreya SC", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(242,232,208,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 12%, rgba(242,232,208,.45) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 38% 62%, rgba(127,224,207,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 48%, rgba(242,232,208,.4) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 22% 86%, rgba(232,194,106,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 92%, rgba(242,232,208,.35) 50%, transparent 51%),
    radial-gradient(900px 500px at 15% -10%, #2a1f4d 0%, transparent 60%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--body);
  font-size:17px;
  line-height:1.45;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arcane);outline-offset:3px;border-radius:10px}
.app{max-width:1120px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);letter-spacing:.02em;color:var(--gold);margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--caps);font-size:14px;color:var(--mist);letter-spacing:.08em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--night);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--arcane);color:var(--arcane)}
.save{font-size:13px;color:var(--mist)}

/* Herói */
.hero{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:18px;align-items:stretch}
@media (max-width:780px){.hero{grid-template-columns:1fr}}
.stage{position:relative;border-radius:26px;overflow:hidden;min-height:360px;
  background:radial-gradient(circle at 50% 58%, #33285a 0%, #1d1830 55%, #151126 100%);
  border:1px solid var(--line);display:grid;place-items:center}
.ring{position:absolute;inset:8%;opacity:.5;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage .avatar{position:relative;width:min(88%,330px)}
.lvbadge{position:absolute;top:12px;left:12px;font-family:var(--caps);font-size:14px;background:rgba(19,15,30,.7);border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--gold)}
.custom{position:absolute;top:12px;right:12px}
.info{background:var(--night);border:1px solid var(--line);border-radius:26px;padding:22px;display:grid;gap:14px;align-content:start}
.eyebrow{font-family:var(--caps);letter-spacing:.1em;color:var(--mist);font-size:14px;margin:0}
.title{font-family:var(--display);font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0;color:var(--parchment);text-wrap:balance}
.xprow{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.bignum{font-family:var(--display);font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
.muted{color:var(--mist)}
.gems{display:flex;gap:10px;flex-wrap:wrap}
.gem{display:grid;justify-items:center;gap:4px;font-family:var(--caps);font-size:13px;color:var(--mist);background:none;border:0;padding:4px 2px;cursor:pointer;border-radius:10px}
.gem:hover i{border-color:var(--arcane)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--mist)}
.edit:disabled{opacity:.35;cursor:not-allowed}
.gem i{width:34px;height:34px;display:block;transform:rotate(45deg);border-radius:7px;border:2px solid rgba(232,194,106,.35);background:rgba(232,194,106,.06);transition:all .4s}
.gem.on i{background:linear-gradient(135deg,var(--gold),#fff3c9);border-color:#fff3c9;box-shadow:0 0 18px rgba(232,194,106,.7)}
.gem.today i{outline:2px dashed var(--arcane);outline-offset:4px}
.gem.free i{transform:none;border-radius:50%;width:24px;height:24px;margin:5px 0;border-style:dashed;opacity:.7}
.gem small{font-size:11px;margin-top:-4px}
.gem.lit i{animation:gemlit 1s ease-out}
@keyframes gemlit{0%{transform:rotate(45deg) scale(.6)}60%{transform:rotate(45deg) scale(1.3)}100%{transform:rotate(45deg) scale(1)}}
.next{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.prog{display:grid;gap:6px}
.prog .lab{display:flex;justify-content:space-between;gap:10px;font-size:15px;flex-wrap:wrap}
.prog .lab b{font-variant-numeric:tabular-nums}
.pbar{height:16px;border-radius:99px;background:rgba(168,159,191,.15);overflow:hidden;border:1px solid rgba(232,194,106,.25)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--arcane),var(--gold));transition:width .7s ease;box-shadow:0 0 12px rgba(232,194,106,.5)}
.pbar.days i{background:linear-gradient(90deg,#b28cff,var(--gold))}
.unlock{padding:12px 14px;border-radius:14px;background:var(--night-2);border:1px solid var(--line);display:grid;gap:4px}
.unlock b{color:var(--gold)}
.banner{padding:12px 14px;border-radius:14px;background:rgba(127,224,207,.1);border:1px solid rgba(127,224,207,.35);color:var(--parchment)}
.banner.gold{background:rgba(232,194,106,.12);border-color:rgba(232,194,106,.45)}

/* Cartas */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;align-items:start}
.card{background:var(--night);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.card h2{font-family:var(--caps);font-size:20px;letter-spacing:.04em;margin:0;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-family:var(--body);font-size:14px;color:var(--mist);letter-spacing:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--night-2);border-color:var(--gold);color:var(--gold)}
.tab.done::after{content:" ✦";color:var(--gold)}
.missions{display:grid;gap:8px}
.mis{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid rgba(168,159,191,.22);background:var(--night-2);cursor:pointer;transition:border-color .2s, background .2s, transform .15s}
.mis:hover:not(:disabled){border-color:rgba(232,194,106,.5)}
.mis:active:not(:disabled){transform:scale(.98)}
.mis:disabled{opacity:.45;cursor:not-allowed}
.mis .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(19,15,30,.6);color:var(--mist);border:1px solid rgba(168,159,191,.2)}
.mis .ic svg{width:22px;height:22px}
.mis b{display:block;font-weight:700;font-size:16px}
.mis em{font-style:normal;font-family:var(--caps);font-size:13px;color:var(--mist);letter-spacing:.04em}
.mis .xp{font-family:var(--caps);font-size:14px;color:var(--mist);font-variant-numeric:tabular-nums}
.mis[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(120deg,rgba(232,194,106,.18),rgba(127,224,207,.08))}
.mis[aria-pressed="true"] .ic{background:var(--gold);color:var(--ink);border-color:#fff3c9;box-shadow:0 0 16px rgba(232,194,106,.6)}
.mis[aria-pressed="true"] .xp{color:var(--gold)}
.mis.key{border-style:dashed}
.mis.pop{animation:pop .45s ease-out}
.misrow{display:flex;gap:6px;align-items:stretch}
.edrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px dashed rgba(127,224,207,.45);background:var(--night-2)}
.edname{display:grid}.edname span{font-size:13px;color:var(--mist)}
.edctl{display:flex;gap:6px;align-items:center}
.stp{width:36px;height:36px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;cursor:pointer}
.wprev{margin:0}
.misrow .mis{flex:1}
.mis.extra{border-color:rgba(127,224,207,.4)}
.xdel{width:40px;border-radius:12px;border:1px solid rgba(255,157,177,.5);background:transparent;color:var(--rose);cursor:pointer;font-size:20px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.hint{font-size:14px;color:var(--mist);margin:0}

.attrs{display:grid;gap:10px}
.attr{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:99px;background:rgba(168,159,191,.15);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--arcane),var(--gold));transition:width .6s ease}
.attr .rank{font-family:var(--caps);color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}

.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:10px}
@media (max-width:620px){.journey{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prog .gems{margin-top:6px}
.node{border-radius:16px;border:1px solid rgba(168,159,191,.2);background:var(--night-2);padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:13px}
.node .tag{margin-top:auto}
.node .mini{width:74px;height:90px}
.node.locked .mini{filter:saturate(.45);opacity:.72}
.node.current{border-color:var(--arcane);box-shadow:0 0 0 1px var(--arcane) inset}
.node.won{border-color:var(--gold)}
.node b{font-family:var(--caps);font-size:13px;color:var(--parchment)}
.node small{color:var(--mist)}
.tag{font-family:var(--caps);font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.node.won .tag{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.node.current .tag{color:var(--arcane);border-color:var(--arcane)}

.field{display:grid;gap:4px}
.field label{font-family:var(--caps);font-size:14px;color:var(--mist)}
.field input{background:var(--night-2);border:1px solid rgba(168,159,191,.3);border-radius:10px;padding:9px 11px;color:var(--parchment);font:inherit}
.btn{padding:12px 16px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(120deg,var(--gold),#f6dc9a);color:var(--ink);font-weight:700;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold)}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}

/* Toast e XP flutuante */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--night-2);border:1px solid var(--gold);padding:12px 18px;border-radius:14px;max-width:min(92vw,520px);text-align:center;transition:all .35s;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.floatxp{position:fixed;z-index:45;font-family:var(--display);font-size:22px;color:var(--gold);pointer-events:none;text-shadow:0 0 12px rgba(232,194,106,.8);animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.15)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:44}

/* Diálogos */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,18,.82);display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--night);border:1px solid var(--gold);border-radius:24px;padding:22px;max-width:520px;width:100%;display:grid;gap:14px;text-align:center;max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--display);font-size:26px;margin:0;color:var(--gold);text-wrap:balance}
.sheet .avatar{width:min(70%,260px);margin:0 auto;position:relative}
.flash{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,243,201,.8) 30%,transparent 70%);opacity:0;pointer-events:none}
.flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
.reveal{animation:reveal .9s ease-out}
@keyframes reveal{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,194,106,.3)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sheet.wide{max-width:760px;text-align:left}
.edlist{display:grid;gap:10px}
.edfoot{position:sticky;bottom:-22px;margin:0 -22px -22px;padding:14px 22px;background:var(--night);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;z-index:2}
.edfoot .ask{font-family:var(--caps);color:var(--gold)}
.ed{border:1px solid rgba(168,159,191,.25);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--night-2)}
.ed .r{display:grid;grid-template-columns:1fr 90px;gap:8px}
.ed .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed input,.ed select,.restore textarea{background:var(--ink);border:1px solid rgba(168,159,191,.3);border-radius:10px;padding:8px 10px;color:var(--parchment);font:inherit;width:100%}
.ed label,.restore label{font-family:var(--caps);font-size:13px;color:var(--mist);display:grid;gap:3px}
.dtog{display:flex;gap:5px;flex-wrap:wrap}
.dtog button{padding:5px 9px;border-radius:8px;border:1px solid rgba(168,159,191,.3);background:transparent;cursor:pointer;font-size:13px}
.dtog button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.ed .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.check{display:flex!important;align-items:center;gap:8px;grid-template-columns:none!important}
.check input{width:auto}
.del{background:transparent;border:1px solid rgba(255,157,177,.5);color:var(--rose);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
.small{font-size:13px;padding:6px 10px}
.hist{display:grid;gap:6px;max-height:280px;overflow:auto}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--night-2);font-size:14px;font-variant-numeric:tabular-nums}
.hrow .tag{white-space:nowrap}
.restore{display:grid;gap:10px;text-align:left}
.restore textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
.edit{background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:4px 10px;cursor:pointer;font-family:var(--body);font-size:13px}

/* Animações da maga */
.fig{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.aura,.glow{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.fl{transform-box:fill-box;transform-origin:center;animation:floaty 4.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-9px) rotate(5deg)}}
.cast .fig{animation:cast .75s ease-out}
@keyframes cast{0%{transform:translateY(0)}35%{transform:translateY(-18px) scale(1.03)}100%{transform:translateY(0)}}
.cast .glow{animation:none;opacity:1}

.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- versão simples ---- */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.tasks{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--night-2);border:1px solid rgba(168,159,191,.2);transition:border-color .2s}
.task.on{border-color:rgba(232,194,106,.5)}
.task.on .tname b{text-decoration:line-through;opacity:.6}
.task.pop{animation:pop .45s ease-out}
.chk{flex:0 0 42px;height:42px;border-radius:12px;border:2px solid var(--gold);background:transparent;color:var(--ink);font-weight:800;font-size:20px;cursor:pointer;transition:background .2s, box-shadow .2s}
.chk:hover{background:rgba(232,194,106,.15)}
.chk[aria-pressed="true"]{background:var(--gold);box-shadow:0 0 14px rgba(232,194,106,.6)}
.tname{flex:1;display:grid;min-width:0}
.tname b{font-weight:700;overflow-wrap:anywhere}
.tname small{color:var(--mist);font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pen{flex:0 0 36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mist);cursor:pointer;display:grid;place-items:center}
.pen:hover{color:var(--gold);border-color:var(--gold)}
.pen svg{width:18px;height:18px}
.add input{width:100%;background:var(--ink);border:1px dashed rgba(232,194,106,.45);border-radius:12px;padding:11px 12px;color:var(--parchment);font:inherit}
.add input:focus{border-style:solid;border-color:var(--arcane);outline:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--night-2);border-color:var(--gold);color:var(--gold)}
.coin{width:16px;height:16px;vertical-align:-3px;flex:0 0 auto}
.coins{display:inline-flex;align-items:center;gap:5px;font-family:var(--body);color:var(--gold)}
.stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.buy{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(120deg,var(--gold),#f6dc9a);color:var(--ink);font-weight:700;cursor:pointer}
.buy:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--arcane);cursor:pointer;padding:0;font-size:14px;justify-self:start;text-align:left}
.small{font-size:13px}
.eyebrow.small{font-size:13px}
.stage{min-height:330px}
.sheet .journey{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.sheet .journey{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hrow{grid-template-columns:auto 1fr auto}
.tm{background:rgba(127,224,207,.15);color:var(--arcane);border-radius:6px;padding:0 6px;margin-right:4px;font-variant-numeric:tabular-nums}
.rtrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--night-2);border:1px solid rgba(168,159,191,.2)}
.rtrow:not(.in){opacity:.7}
.rttime{background:var(--ink);border:1px solid rgba(168,159,191,.3);border-radius:10px;padding:7px 8px;color:var(--parchment);font:inherit;color-scheme:dark}
.rtadd{display:flex;gap:8px}.rtadd input[name=t]{width:auto;flex:0 0 auto;color-scheme:dark}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 auto;min-width:48px}

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
"use strict";

const LEVELS = [
  {n:1,title:"Aprendiz de Dados",change:"Começar a rotina e anotar o sono",wake:"11h",sleep:"3h",session:"2h",phase:"SQL",unlock:"túnica de aprendiz e varinha de madeira"},
  {n:2,title:"Exploradora de Tabelas",change:"Acordar 30 min mais cedo",wake:"10h30",sleep:"2h30",session:"2h",phase:"SQL",unlock:"chapéu de maga e manto azul"},
  {n:3,title:"Mestra das Queries",change:"Sessão sobe para 2h30",wake:"10h30",sleep:"2h30",session:"2h30",phase:"SQL",unlock:"cajado com cristal das Queries e manto estrelado"},
  {n:4,title:"Iniciada em Python",change:"Acordar 30 min mais cedo e passar o inglês pra manhã",wake:"10h",sleep:"2h",session:"2h30",phase:"Python",unlock:"capa e uma serpente Python de estimação"},
  {n:5,title:"Domadora de Dados",change:"Sessão sobe para 3h",wake:"10h",sleep:"2h",session:"3h",phase:"Python",unlock:"aura arcana e bordados de ouro"},
  {n:6,title:"Arquiteta de Análises",change:"Acordar 30 min mais cedo",wake:"9h30",sleep:"1h30",session:"3h",phase:"Python",unlock:"um grimório flutuante"},
  {n:7,title:"Artesã de Dashboards",change:"Acordar 30 min mais cedo",wake:"9h",sleep:"1h",session:"3h",phase:"Power BI",unlock:"runas de dashboard que orbitam você"},
  {n:8,title:"Arquimaga Lançada",change:"Lançamento do projeto (chefão final)",wake:"9h",sleep:"1h",session:"3h",phase:"Power BI e publicação",unlock:"manto dourado, asas de luz e coroa de estrelas"}
];

const SKINS = ["#f6dcc4","#efc9a8","#e2ae86","#b77a52","#7a4a2c"];
const HAIRS = ["#231814","#3a281e","#6e4327","#b9532f","#e3c27a"];
const LIPS = "#d4848c";

/* ---------- Dados ---------- */
const DIFF = {easy:{n:"Fácil",x:5,w:1},med:{n:"Médio",x:10,w:2},hard:{n:"Difícil",x:20,w:4}};
const coinsOf = x => Math.max(1,Math.round(x/5));
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ALL = [0,1,2,3,4,5,6];
const WAKE_NAME = "Acordar no horário";
const DEFAULT_DAILIES = () => [
  {id:"limpeza",name:"Varrer e passar pano",diff:"easy",days:ALL.slice()},
  {id:"acordar",name:WAKE_NAME,diff:"med",days:ALL.slice()},
  {id:"faculdade",name:"Faculdade (30 min)",diff:"med",days:[1,2,3,4,5]},
  {id:"ingles",name:"Inglês ativo (1h)",diff:"med",days:ALL.slice()},
  {id:"sessao",name:"Sessão de dados (ou meta mínima)",diff:"hard",days:[1,2,3,4]},
  {id:"fechamento",name:"Fechamento: commit, diário e check",diff:"easy",days:[1,2,3,4]},
  {id:"sabado",name:"Bloco de sábado",diff:"hard",days:[6]},
  {id:"revisao",name:"Revisão de sábado",diff:"med",days:[6]},
  {id:"posts",name:"Agendar os posts do LinkedIn",diff:"med",days:[6]},
  {id:"candidaturas",name:"Candidaturas",diff:"med",days:[6]},
  {id:"arrumacao",name:"Arrumação do quarto (1h)",diff:"med",days:[0]}
];
const DEFAULT_REWARDS = () => [
  {id:"b99",name:"2 episódios de Brooklyn Nine-Nine",cost:10},
  {id:"grande",name:"Recompensa grande (toque no lápis para editar)",cost:80}
];
const DEFAULT = () => ({v:6,distribute:true,dayTotal:100,level:1,levelBase:0,meta:400,done:false,dailies:DEFAULT_DAILIES(),todos:[],rewards:DEFAULT_REWARDS(),
  log:{},purchases:[],history:[],look:{skin:1,hair:0},sound:false,calm:false,levels:JSON.parse(JSON.stringify(LEVELS))});

/* ---------- Datas ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays = (s,n) => {const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const fmt = s => {const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1);};
const today = () => iso(new Date());
const toMin = t => {const m=String(t).match(/(\d+)h(\d+)?/);return m?Number(m[1])*60+Number(m[2]||0):0;};
const fromMin = m => Math.floor(m/60)+"h"+(m%60?pad(m%60):"");
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Estado ---------- */
let state = DEFAULT();
function migrate(d){
  d=d||{};
  if(!(d.v>=6)){ /* versões antigas: começa limpo, guardando nível, aparência e jornada */
    const s=DEFAULT();
    s.level=Math.max(1,Math.min(8,Number(d.level)||1)); s.done=!!d.done;
    if(d.look) s.look=Object.assign(s.look,d.look);
    s.sound=!!d.sound; s.calm=!!d.calm;
    if(Array.isArray(d.levels)&&d.levels.length===8) s.levels=d.levels;
    d=s;
  }
  const s=Object.assign(DEFAULT(),d);
  s.look=Object.assign({skin:1,hair:0},s.look||{});
  ["dailies","todos","rewards","purchases","history"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=DEFAULT()[k];});
  if(!s.log||typeof s.log!=="object") s.log={};
  s.meta=Math.max(50,Math.min(5000,Number(s.meta)||400));
  if(!Array.isArray(s.levels)||s.levels.length!==8) s.levels=clone(LEVELS);
  s.levels=s.levels.map((l,i)=>Object.assign({},LEVELS[i],l,{n:i+1,unlock:LEVELS[i].unlock}));
  s.dailies.forEach(t=>{if(!DIFF[t.diff])t.diff="med";if(!Array.isArray(t.days))t.days=ALL.slice();if(!t.times||typeof t.times!=="object")t.times={};});
  if(typeof s.distribute!=="boolean") s.distribute=true;
  s.dayTotal=Math.max(10,Math.min(1000,Number(s.dayTotal)||100));
  s.todos.forEach(t=>{if(!DIFF[t.diff])t.diff="med";});
  s.v=6; return s;
}
const LVS = () => state.levels;
const L = () => LVS()[state.level-1];
const timeOf = (t,wd) => (t.times&&t.times[wd])||"";
const dueFor = s => {const wd=parse(s).getDay();return state.dailies.map((t,i)=>[t,i]).filter(([t])=>t.days.includes(wd))
  .sort((a,b)=>{const ta=timeOf(a[0],wd),tb=timeOf(b[0],wd);if(ta&&tb)return ta<tb?-1:ta>tb?1:a[1]-b[1];if(ta)return -1;if(tb)return 1;return a[1]-b[1];}).map(([t])=>t);};
function xpMap(s){
  const due=dueFor(s), out={};
  if(!state.distribute){due.forEach(t=>out[t.id]=DIFF[t.diff].x);return out;}
  if(!due.length) return out;
  const w=due.map(t=>DIFF[t.diff].w), sum=w.reduce((a,b)=>a+b,0), raw=w.map(x=>x/sum*state.dayTotal), base=raw.map(Math.floor);
  let left=state.dayTotal-base.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-base[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){base[i]++;left--;}});
  due.forEach((t,i)=>out[t.id]=Math.max(1,base[i])); return out;
}
function resync(){
  const t=today();
  for(const s in state.log){ if(s<t) continue; const m=xpMap(s);
    for(const id in state.log[s]){ if(id in m){state.log[s][id].x=m[id];state.log[s][id].c=coinsOf(m[id]);} else delete state.log[s][id]; }
    if(!Object.keys(state.log[s]).length) delete state.log[s]; }
}
const dayXP = s => Object.values(state.log[s]||{}).reduce((a,v)=>a+v.x,0);
function totalXP(){let t=0;for(const s in state.log)t+=dayXP(s);for(const x of state.todos)if(x.done)t+=x.x;return t;}
function coins(){let c=0;for(const s in state.log)for(const v of Object.values(state.log[s]))c+=v.c;for(const x of state.todos)if(x.done)c+=x.c;return c-state.purchases.reduce((a,p)=>a+p.cost,0);}
const levelProgress = () => Math.max(0,totalXP()-state.levelBase);
function checkLevelUp(){
  const ups=[];
  while(!state.done&&levelProgress()>=state.meta){
    const old=state.level; state.levelBase+=state.meta; state.history.push({level:old,date:today()});
    if(old===8){state.done=true;ups.push({old,done:true});break;}
    state.level=old+1; ups.push({old,done:false});
  }
  return ups;
}

/* ---------- A maga ---------- */
const STYLE = [
  {robe:"#8b7a62",dark:"#6a5c49",accent:"#a58e6e",hat:null,cape:null,capelet:null,belt:"rope",staff:"stick",gem:null,aura:null,patches:true},
  {robe:"#4f72b8",dark:"#3b5795",accent:"#2f4677",hat:"#34497e",cape:null,capelet:"#2f4677",belt:"sash",bag:true,staff:"stick",gem:null,aura:null},
  {robe:"#2f4f96",dark:"#233c75",accent:"#1c3060",hat:"#22386c",cape:null,capelet:"#1c3060",belt:"sash",bag:true,staff:"staff",gem:"#6fb6ff",aura:null,cuffs:true,embroid:"stars",emb:"#d6e4ff"},
  {robe:"#2b7d6a",dark:"#1f5c4e",accent:"#174a3f",hat:"#1f5447",cape:"#123a32",capelet:"#174a3f",belt:"sash",staff:"staff",gem:"#7be08f",aura:null,cuffs:true,embroid:"scales",emb:"#9ff0bd"},
  {robe:"#5b3fa2",dark:"#43307a",accent:"#33245e",hat:"#3d2970",cape:"#271a4c",capelet:"#33245e",belt:"gold",staff:"staff",gem:"#7be08f",aura:"#7fe0cf",cuffs:true,embroid:"stars",emb:"#e8c26a",over:true,trim:true},
  {robe:"#3e2f86",dark:"#2e2266",accent:"#231a52",hat:"#2a1d5e",cape:"#1b1342",capelet:"#231a52",belt:"gold",staff:"staff",gem:"#b28cff",aura:"#b28cff",cuffs:true,embroid:"runes",emb:"#e8c26a",over:true,trim:true,pauldrons:true},
  {robe:"#6e2c7f",dark:"#521f60",accent:"#3e1749",hat:"#4a1f57",cape:"#2f1238",capelet:"#3e1749",belt:"gold",staff:"staff",gem:"#f2c94c",aura:"#f2c94c",cuffs:true,embroid:"bars",emb:"#f2c94c",over:true,trim:true,pauldrons:true},
  {robe:"#f3e8c8",dark:"#d8c38f",accent:"#e8c26a",hat:"#e8c26a",cape:"#7a5bd1",capelet:"#e8c26a",belt:"gold",staff:"staff",gem:"#ffffff",aura:"#ffe7a3",cuffs:true,embroid:"stars",emb:"#b8913a",over:true,trim:true,pauldrons:true,wings:true}
];
const star = (x,y,r) => `M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z`;
let uidc = 0;
function avatarSVG(lv,look,mini){
  const S = STYLE[lv-1], u = "a"+(uidc++), skin = SKINS[look.skin]||SKINS[1], hair = HAIRS[look.hair]||HAIRS[0];
  const gold = "#e8c26a", ink = "#2a2238";
  let p = `<svg viewBox="0 -40 240 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maga no nível ${lv}"><defs>
  <radialGradient id="${u}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${S.aura||"#7fe0cf"}" stop-opacity=".6"/><stop offset="1" stop-color="${S.aura||"#7fe0cf"}" stop-opacity="0"/></radialGradient></defs>`;
  if(S.aura) p += `<circle class="aura" cx="120" cy="150" r="128" fill="url(#${u}g)"/>`;

  p += `<g class="fig">`;
  if(S.wings) p += `<path d="M92 160C40 116 6 146 18 204C40 190 62 196 82 212Z" fill="rgba(255,243,201,.55)" stroke="${gold}" stroke-width="2"/><path d="M148 160C200 116 234 146 222 204C200 190 178 196 158 212Z" fill="rgba(255,243,201,.55)" stroke="${gold}" stroke-width="2"/>`;
  if(S.cape) p += `<path d="M84 150Q60 228 50 282L190 282Q180 228 156 150Z" fill="${S.cape}"/>${S.trim?`<path d="M50 282L190 282" stroke="${gold}" stroke-width="3"/>`:""}`;

  p += `<g transform="translate(120 144) scale(0.8) translate(-120 -144)"><path d="M80 104Q78 57 120 57Q162 57 160 104L172 236Q157 244 142 236L146 150L94 150L98 236Q83 244 68 236Z" fill="${hair}"/><path d="M82 120Q78 180 76 232M158 120Q162 180 164 232" stroke="#000" stroke-opacity=".25" stroke-width="1.2" fill="none"/></g>`;

  // saia por cima

  // cinto
  if(S.belt==="rope") p += `<path d="M86 190Q120 200 154 190" stroke="#c9a46a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="104" cy="195" r="4" fill="#c9a46a"/><path d="M104 198l-3 18M105 198l4 16" stroke="#c9a46a" stroke-width="2.4" stroke-linecap="round"/>`;
  if(S.belt==="sash") p += `<path d="M86 190Q120 200 154 190" stroke="${S.accent}" stroke-width="8" fill="none" stroke-linecap="round"/>`;

  if(S.patches) p += `<g><rect x="94" y="226" width="13" height="11" rx="1.5" fill="${S.accent}" transform="rotate(-8 100 231)"/><rect x="136" y="244" width="11" height="10" rx="1.5" fill="${S.accent}" transform="rotate(6 141 249)"/><path d="M95 227h11M137 245h9" stroke="#e9d9b8" stroke-width="1" stroke-dasharray="2 2"/></g>`;

  // braços, punhos e mãos
  p += `<path d="M92 156Q70 190 74 212" stroke="${S.dark}" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M148 156Q172 170 182 177" stroke="${S.dark}" stroke-width="18" fill="none" stroke-linecap="round"/>`;
  if(S.cuffs) p += `<ellipse cx="74" cy="212" rx="11" ry="5" fill="${S.trim?gold:S.accent}"/><ellipse cx="181" cy="177" rx="6" ry="10" transform="rotate(-50 181 177)" fill="${S.trim?gold:S.accent}"/>`;
  p += `<circle cx="74" cy="220" r="9" fill="${skin}"/><circle cx="187" cy="180" r="9" fill="${skin}"/>`;
  // capinha e ombreiras
  if(S.capelet) p += `<path d="M86 150Q120 134 154 150Q160 170 148 176Q120 164 92 176Q80 170 86 150Z" fill="${S.capelet}"/>${S.trim?`<path d="M92 176Q120 164 148 176" stroke="${gold}" stroke-width="3" fill="none"/>`:""}`;
  if(S.pauldrons) p += `<ellipse cx="88" cy="158" rx="15" ry="9" fill="${gold}" stroke="#fff3c9" stroke-width="1"/><ellipse cx="152" cy="158" rx="15" ry="9" fill="${gold}" stroke="#fff3c9" stroke-width="1"/><circle cx="88" cy="158" r="3" fill="${S.gem}"/><circle cx="152" cy="158" r="3" fill="${S.gem}"/>`;
  p += `<ellipse cx="98" cy="284" rx="15" ry="6" fill="${ink}"/><ellipse cx="142" cy="284" rx="15" ry="6" fill="${ink}"/>`;
  // gola alta escura
  p += `<path d="M108 130h24v20q-12 5-24 0z" fill="#1b1622"/><path d="M108 137h24M108 143h24" stroke="#2b2433" stroke-width="1.5"/>`;
  p += `<g transform="translate(120 144) scale(0.8) translate(-120 -144)">`;
  // rosto fino e alongado
  p += `<path d="M89 98C89 74 103 63 120 63C137 63 151 74 151 98C151 121 142 137 120 144C98 137 89 121 89 98Z" fill="${skin}"/>`;
  p += `<path d="M99 97.5Q106 92.5 115 95.5" stroke="${hair}" stroke-width="2.3" fill="none" stroke-linecap="round"/><path d="M125 95.5Q134 92.5 141 97.5" stroke="${hair}" stroke-width="2.3" fill="none" stroke-linecap="round"/>`;
  p += `<g class="eyes">
    <path d="M100 105Q107 99.5 114 104Q107 110.5 100 105Z" fill="#fbf6f2"/><path d="M126 104Q133 99.5 140 105Q133 110.5 126 104Z" fill="#fbf6f2"/>
    <circle cx="107.6" cy="105" r="3.7" fill="#5a3726"/><circle cx="132.4" cy="105" r="3.7" fill="#5a3726"/>
    <circle cx="107.6" cy="105" r="1.8" fill="${ink}"/><circle cx="132.4" cy="105" r="1.8" fill="${ink}"/>
    <circle cx="108.8" cy="103.7" r="1.2" fill="#fff"/><circle cx="133.6" cy="103.7" r="1.2" fill="#fff"/><circle cx="106.4" cy="106.4" r=".6" fill="#fff" opacity=".8"/><circle cx="131.2" cy="106.4" r=".6" fill="#fff" opacity=".8"/>

const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
const reduce = () => state.calm || matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}
addEventListener("resize",sizeCanvas);sizeCanvas();
function burst(x,y,n,colors){
  if(reduce()) return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,size:3+Math.random()*5,c:colors[i%colors.length],r:Math.random()*6});}
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.life-=.016;p.r+=.1;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.translate(p.x*d,p.y*d);cx.rotate(p.r);
    const s=p.size*d;cx.beginPath();cx.moveTo(0,-s);cx.quadraticCurveTo(0,0,s,0);cx.quadraticCurveTo(0,0,0,s);cx.quadraticCurveTo(0,0,-s,0);cx.quadraticCurveTo(0,0,0,-s);cx.fill();cx.restore();}
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if(!raf) cx.clearRect(0,0,cv.width,cv.height);
}
let actx = null;
function audio(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ actx=null; }
  return actx;
}
function chime(notes,force){
  if(!state.sound&&!force) return;
  const ac=audio(); if(!ac) return;
  try{
    const t0 = ac.currentTime+0.02, master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
    notes.forEach((f,i)=>{
      const t=t0+i*.11;
      [["sine",f,.32],["triangle",f*2,.08],["sine",f/2,.10]].forEach(([type,fr,vol])=>{
        const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=fr;
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
        o.connect(g);g.connect(master);o.start(t);o.stop(t+.95);});
    });
  }catch(e){}
}

  if(t.done){t.done=false;delete t.x;delete t.c;delete t.doneAt;save();render();return;}
  t.x=DIFF[t.diff].x; t.c=coinsOf(t.x); t.done=true; t.doneAt=today();
  const el=$("r-todo-"+id); const leveled=afterXP(); reward(el,t.x,t.c);
  if(!leveled) toast("Afazer concluído! +"+t.x+" XP e +"+t.c+" moedas.");
}
function buy(id){
  const r=state.rewards.find(x=>x.id===id); if(!r||coins()<r.cost) return;
  state.purchases.push({name:r.name,cost:r.cost,date:today()}); save(); render();
  const el=$("r-reward-"+id); if(el){const b=el.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,50,["#e8c26a","#fff3c9","#ff9db1","#b28cff"]);}
  chime([523,659,784,1047]); toast("Aproveite: "+r.name+"!");
}

/* ---------- Edição ---------- */
function openModal(html,wide){$("sheet").className="sheet"+(wide?" wide":"");$("sheet").innerHTML=html;$("modal").classList.add("open");const f=$("sheet").querySelector("input,button");if(f)f.focus();}
function closeModal(){$("modal").classList.remove("open");editing=null;}
function listOf(kind){return kind==="daily"?state.dailies:kind==="todo"?state.todos:state.rewards;}
function openEdit(kind,id){const it=listOf(kind).find(x=>x.id===id);if(!it)return;editing={kind,id,item:clone(it)};drawEdit();}
function drawEdit(){
  const {kind,item}=editing, label={daily:"Editar diária",todo:"Editar afazer",reward:"Editar recompensa"}[kind];
  let h=`<h3 id="mTitle">${label}</h3><div class="ed" style="text-align:left"><label>Nome<input id="edName" value="${esc(item.name)}"></label>`;
  if(kind!=="reward") h+=`<div><span class="eyebrow small">Dificuldade</span><div class="dtog">${Object.keys(DIFF).map(k=>`<button data-action="ed-diff" data-d="${k}" aria-pressed="${item.diff===k}">${DIFF[k].n} · ${state.distribute&&kind==="daily"?"peso "+DIFF[k].w:DIFF[k].x+" XP"}</button>`).join("")}</div></div>`;
  if(kind==="daily") h+=`<div><span class="eyebrow small">Dias</span><div class="dtog">${[1,2,3,4,5,6,0].map(d=>`<button data-action="ed-day" data-d="${d}" aria-pressed="${item.days.includes(d)}">${WD[d]}</button>`).join("")}</div></div>`;
  if(kind==="reward") h+=`<label>Preço em moedas<input id="edCost" type="number" min="1" max="9999" value="${item.cost}"></label>`;
  h+=`</div>${kind==="daily"&&state.distribute?`<p class="hint">O dia completo vale ${state.dayTotal} XP, dividido entre as diárias do dia pela dificuldade. Difícil leva 4 vezes mais que Fácil.</p>`:""}${kind!=="reward"?'<p class="hint">Os dias que já passaram continuam com o XP da época.</p>':""}
    <div class="row" style="justify-content:space-between"><button class="del" data-action="ed-del">Apagar</button><span class="row"><button class="btn ghost" data-action="modal-x">Cancelar</button><button class="btn" data-action="ed-save">Salvar</button></span></div>`;
  openModal(h);
}
function saveEdit(){
  const {kind,id,item}=editing; item.name=String(item.name||"").trim()||"Sem nome";
  if(kind==="daily"&&!item.days.length){toast("Escolha pelo menos um dia.");return;}
  const l=listOf(kind), i=l.findIndex(x=>x.id===id); if(i>=0) l[i]=item;
  if(kind==="daily") resync();
  closeModal(); save(); render(); toast("Salvo.");
}
function delEdit(){
  const {kind,id}=editing, l=listOf(kind), i=l.findIndex(x=>x.id===id);
  if(i>=0){ if(kind==="todo"&&l[i].done){toast("Afazer concluído fica no histórico. Desmarque antes, se quiser apagar.");return;} l.splice(i,1); }
  if(kind==="daily") resync();
  closeModal(); save(); render(); toast("Apagado. O XP que você já ganhou com ele nos dias anteriores continua.");
}
function openCustom(){
  openModal(`<h3 id="mTitle">Sua maga</h3><div class="avatar">${avatarSVG(state.level,state.look,false)}</div>
    <p class="eyebrow">Tom de pele</p><div class="swatches">${SKINS.map((c,i)=>`<button class="sw" style="background:${c}" data-action="skin" data-i="${i}" aria-label="Tom de pele ${i+1}" aria-pressed="${state.look.skin===i}"></button>`).join("")}</div>
    <p class="eyebrow">Cabelo</p><div class="swatches">${HAIRS.map((c,i)=>`<button class="sw" style="background:${c}" data-action="hair" data-i="${i}" aria-label="Cor de cabelo ${i+1}" aria-pressed="${state.look.hair===i}"></button>`).join("")}</div>
    <div class="row"><button class="btn" data-action="modal-x">Pronto</button></div>`);
}

/* ---------- Menu ---------- */
function openMenu(){
  const days=[];for(let i=0;i<14;i++){const s=addDays(today(),-i);if(state.log[s])days.push(`<div class="hrow"><span>${WD[parse(s).getDay()]} ${fmt(s)}</span><span>${Object.keys(state.log[s]).length} diárias</span><span>${dayXP(s)} XP</span></div>`);}
  const buys=state.purchases.slice(-8).reverse().map(p=>`<div class="hrow"><span>${fmt(p.date)}</span><span>${esc(p.name)}</span><span>${p.cost} moedas</span></div>`).join("");
  openModal(`<h3 id="mTitle">Menu</h3>
    <p class="eyebrow">Rotina</p>
    <div class="row" style="justify-content:flex-start"><button class="btn ghost small" data-action="routine">Rotina da semana: dias e horários</button><button class="btn ghost small" data-action="lv-edit">Editar níveis</button></div>
    <div class="ed"><label class="check"><input type="checkbox" id="distIn" ${state.distribute?"checked":""}> Distribuir o XP do dia entre as diárias</label>
      <label>XP de um dia completo<input id="dayIn" type="number" min="10" max="1000" value="${state.dayTotal}" ${state.distribute?"":"disabled"}></label>
      <p class="hint">${state.distribute?`Ligado: cada dia completo vale ${state.dayTotal} XP, dividido pela dificuldade. Com ${state.meta} XP por nível, são uns ${Math.round(state.meta/state.dayTotal*10)/10} dias completos por nível.`:"Desligado: Fácil vale 5 XP, Médio 10 e Difícil 20, não importa quantas tarefas tem no dia."}</p></div>
    <div class="ed"><label>XP para subir cada nível<input id="metaIn" type="number" min="50" max="5000" value="${state.meta}"></label></div>
    <p class="eyebrow">Preferências</p>
    <div class="row" style="justify-content:flex-start"><button class="chip" data-action="sound" aria-pressed="${state.sound}">${state.sound?"Som ligado":"Som desligado"}</button><button class="chip" data-action="calm" aria-pressed="${state.calm}">Modo calmo ${state.calm?"ligado":"desligado"}</button><button class="chip" data-action="custom">Aparência da maga</button></div>
    <p class="eyebrow">Histórico (14 dias)</p><div class="hist">${days.join("")||'<p class="hint">Ainda vazio.</p>'}</div>
    ${buys?`<p class="eyebrow">Recompensas resgatadas</p><div class="hist">${buys}</div>`:""}
    <p class="eyebrow">Backup</p>
    <p class="hint">Seus registros ficam salvos neste aparelho, sem internet e sem conta. Baixe um backup todo sábado, na revisão: se você limpar os dados do navegador ou trocar de aparelho, é ele que traz tudo de volta. Para passar o progresso para outro aparelho, baixe aqui e restaure lá.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn ghost small" data-action="dl">Baixar backup</button><button class="btn ghost small" data-action="copy">Copiar backup</button><button class="btn ghost small" data-action="restore">Restaurar backup</button></div>
    <div class="row"><button class="btn" data-action="modal-x">Fechar</button></div>`,true);
}
function openLevels(){
  openModal(`<h3 id="mTitle">Editar níveis e rotina</h3><p class="hint">Mude o nome dos níveis e a rotina de cada fase. As roupas da maga continuam as mesmas de cada nível.</p>
    <div class="edlist">${LVS().map((l,i)=>`<div class="ed"><span class="eyebrow small">Nível ${l.n}</span>
      <div class="r2"><label>Nome do nível<input id="lv${i}-title" value="${esc(l.title)}"></label><label>Fase do projeto<input id="lv${i}-phase" value="${esc(l.phase)}"></label></div>
      <label>Mudança na rotina<input id="lv${i}-change" value="${esc(l.change)}"></label>
      <div class="r2"><label>Acordar<input id="lv${i}-wake" value="${esc(l.wake)}"></label><label>Sessão<input id="lv${i}-session" value="${esc(l.session)}"></label></div></div>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-action="modal-x">Cancelar</button><button class="btn" data-action="lv-save">Salvar</button></div>`,true);
}
function saveLevels(){
  state.levels=LVS().map((l,i)=>{const g=f=>{const el=$("lv"+i+"-"+f);const v=el?el.value.trim():"";return v||l[f];};
    return Object.assign({},l,{title:g("title"),phase:g("phase"),change:g("change"),wake:g("wake"),session:g("session")});});
  save(); closeModal(); render(); toast("Jornada salva.");
}

/* ---------- Rotina da semana ---------- */
let rtWd=1;
function drawRoutine(){
  const ref=(()=>{let s=today();while(parse(s).getDay()!==rtWd)s=addDays(s,1);return s;})();
  const on=dueFor(ref), off=state.dailies.filter(t=>!t.days.includes(rtWd)), map=xpMap(ref);
  const row=(t,inDay)=>`<div class="rtrow ${inDay?"in":""}">
    <button class="chk" data-action="rt-toggle" data-id="${esc(t.id)}" aria-pressed="${inDay}" aria-label="${inDay?"Tirar de":"Colocar em"} ${WD[rtWd]}: ${esc(t.name)}">${inDay?"✓":""}</button>
    <div class="tname"><b>${esc(t.name)}</b><small>${DIFF[t.diff].n}${inDay?" · +"+map[t.id]+" XP":""}</small></div>
    ${inDay?`<input type="time" class="rttime" data-rt-time="${esc(t.id)}" value="${esc(timeOf(t,rtWd))}" aria-label="Horário de ${esc(t.name)}">`:""}</div>`;
  openModal(`<h3 id="mTitle">Rotina da semana</h3>
    <div class="seg wrap">${[1,2,3,4,5,6,0].map(d=>`<button data-action="rt-day" data-d="${d}" aria-pressed="${rtWd===d}">${WD[d]}</button>`).join("")}</div>
    <p class="hint">${on.length} diária${on.length===1?"":"s"} em ${WD[rtWd]}${state.distribute&&on.length?", dividindo "+state.dayTotal+" XP":""}. Coloque um horário para a lista aparecer em ordem. Os dias que já passaram não mudam.</p>
    <div class="tasks" style="text-align:left">${on.map(t=>row(t,true)).join("")||'<p class="hint">Nenhuma diária neste dia ainda.</p>'}</div>
    <form class="add rtadd" data-rtadd="1"><input name="n" placeholder="+ Nova diária só de ${WD[rtWd]} (Enter)" aria-label="Nova diária" autocomplete="off"><input name="t" type="time" aria-label="Horário"></form>
    ${off.length?`<p class="eyebrow small" style="text-align:left">Outras diárias (toque para colocar em ${WD[rtWd]})</p><div class="tasks" style="text-align:left">${off.map(t=>row(t,false)).join("")}</div>`:""}
    <div class="row"><button class="btn" data-action="modal-x">Pronto</button></div>`,true);
}

/* ---------- Cerimônia ---------- */
function ceremony(ups){
  const last=ups[ups.length-1], old=ups[0].old, lv=last.done?LVS()[7]:LVS()[last.old];
  openModal(`<h3 id="mTitle">${last.done?"Chefão final vencido!":"Nível "+lv.n+" conquistado!"}</h3>
    <div class="avatar" id="cerAv">${avatarSVG(old,state.look,false)}<div class="flash" id="flash"></div></div>
    <p class="title" style="font-size:24px" id="cerTitle">${esc(LVS()[old-1].title)}</p>
    <p id="cerTxt" class="muted">A transformação está começando…</p>
    <div class="row"><button class="btn" data-action="modal-x">Continuar</button></div>`);
  const fin=()=>{ const av=$("cerAv"); if(!av) return;
    if(!last.done){av.innerHTML=avatarSVG(lv.n,state.look,false)+'<div class="flash"></div>';av.classList.add("reveal");}
    $("cerTitle").textContent=lv.title;
    $("cerTxt").innerHTML=last.done?`Projeto no ar. Você venceu a jornada inteira.`:`Você ganhou ${esc(lv.unlock)}.<br>Nova rotina, a partir da próxima segunda: <b>${esc(lv.change)}</b>.<br>Que tal comprar uma recompensa para comemorar?`;
    const r=av.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,90,["#e8c26a","#fff3c9","#7fe0cf","#ff9db1","#b28cff"]);
    chime([523,659,784,1047,1319,1568]); render(); };
  if(reduce()) fin(); else { setTimeout(()=>$("flash")&&$("flash").classList.add("go"),500); setTimeout(fin,950); }
}

/* ---------- Backup ---------- */
const backupText=()=>JSON.stringify({app:"jornada-maga",savedAt:new Date().toISOString(),state},null,1);
function downloadBackup(){
  try{const blob=new Blob([backupText()],{type:"application/json"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="jornada-maga-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Backup baixado. Guarde na sua pasta de arquivos ou no Drive.");}
  catch(e){copyBackup();}
}
async function copyBackup(){
  try{await navigator.clipboard.writeText(backupText());toast("Backup copiado. Cole num lugar seguro, como uma nota.");}
  catch(e){openModal(`<h3 id="mTitle">Seu backup</h3><div class="restore"><label>Selecione tudo e copie<textarea readonly>${esc(backupText())}</textarea></label></div><div class="row"><button class="btn" data-action="modal-x">Fechar</button></div>`);}
}
function openRestore(){
  openModal(`<h3 id="mTitle">Restaurar backup</h3><div class="restore">
    <label>Arquivo de backup (.json)<input type="file" id="rsFile" accept=".json,application/json"></label>
    <label>Ou cole o texto do backup<textarea id="rsText" placeholder='{"app":"jornada-maga", …}'></textarea></label>
    <p class="hint">Isto troca o progresso atual pelo do backup.</p></div>
    <div class="row"><button class="btn ghost" data-action="modal-x">Cancelar</button><button class="btn" data-action="do-restore">Restaurar</button></div>`);
}
function doRestore(){
  try{const o=JSON.parse($("rsText").value);const s=o&&o.state?o.state:o;if(!s||typeof s!=="object"||!(("dailies" in s)||("days" in s)))throw 0;
    state=migrate(s);avatarKey="";shownXP=totalXP();checkLevelUp();save();closeModal();render();toast("Backup restaurado.");}
  catch(e){toast("Não reconheci esse backup. Confira se colou o texto inteiro.");}
}

/* ---------- Salvar ---------- */
let docRef=null, saving=false, again=false, saveT=0, mode="local";
function setSave(t){$("save").textContent=t;}
function local(){try{localStorage.setItem("jornada-maga",JSON.stringify(state));}catch(e){}}
function save(){local();setSave("Salvo neste aparelho ✦");}
async function flush(){
  if(!docRef) return;
  if(saving){again=true;return;} saving=true;
  try{await docRef.set(clone(state));setSave("Salvo na sua conta ✦");}
  catch(e){setSave(e&&e.code==="quota_exceeded"?"Espaço cheio: não salvou":"Não salvou agora. Tento de novo na próxima marcação.");}
  saving=false; if(again){again=false;flush();}
}
function connect(){
  setSave("Salvo neste aparelho ✦");
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

/* ---------- Início ---------- */
function start(hot){
  let hadLocal=false;
  try{const c=localStorage.getItem("jornada-maga");if(c){state=migrate(JSON.parse(c));hadLocal=true;}}catch(e){}
  if(hot&&hot.state) state=migrate(hot.state);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches&&!hadLocal) state.calm=true;
  shownXP=totalXP(); const ups0=checkLevelUp(); if(ups0.length) save(); render(); connect(); if(ups0.length) setTimeout(()=>ceremony(ups0),900);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({state}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
